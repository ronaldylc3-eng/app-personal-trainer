<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151517"/>
      <stop offset="100%" stop-color="#08090A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A3D"/>
      <stop offset="60%" stop-color="#FF5A1F"/>
      <stop offset="100%" stop-color="#8A2A0A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fundo quadrado com cantos chanfrados -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="80" fill="none" stroke="#28282D" stroke-width="4"/>
  
  <!-- Ícone Haltere Central com Brilho Laranja -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#glow)">
    <!-- Barra Central -->
    <rect x="140" y="236" width="232" height="40" rx="8" fill="url(#accentGrad)" stroke="#FF7A3D" stroke-width="3"/>
    
    <!-- Anilha Esquerda Interna -->
    <rect x="160" y="180" width="24" height="152" rx="6" fill="#F3F2EF"/>
    <!-- Anilha Esquerda Externa -->
    <rect x="120" y="150" width="32" height="212" rx="8" fill="url(#accentGrad)"/>
    <!-- Trava Esquerda -->
    <rect x="96" y="226" width="16" height="60" rx="4" fill="#5D5D64"/>

    <!-- Anilha Direita Interna -->
    <rect x="328" y="180" width="24" height="152" rx="6" fill="#F3F2EF"/>
    <!-- Anilha Direita Externa -->
    <rect x="360" y="150" width="32" height="212" rx="8" fill="url(#accentGrad)"/>
    <!-- Trava Direita -->
    <rect x="400" y="226" width="16" height="60" rx="4" fill="#5D5D64"/>
  </g>
</svg>
